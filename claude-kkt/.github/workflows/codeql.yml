name: CodeQL (SAST)

# Static analysis of the JavaScript/TypeScript code (API, ERP, website, portal, packages) with the security-extended query suite.
# Findings appear under Security → Code scanning; branch protection can require this check.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 05:17 UTC: new queries run against unchanged code too
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # tag-pinned until the SHA is verified: scripts/ci/action-pins-pending.json (the pin gate fails once that entry expires)
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - "**/node_modules/**"
              - "**/dist/**"
              - "**/.next/**"
              - "**/test/**"
              - apps/api/loadtest
              - docs
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
