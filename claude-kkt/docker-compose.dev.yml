# Local development only: PostgreSQL 16 + Redis 7 with the credentials the API uses by default
# (postgres://postgres:postgres@localhost:5432/kkt and redis://localhost:6379). Not for production.
#   docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kkt
    ports: ["5432:5432"]
    volumes: ["kkt_dev_pg:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
volumes:
  kkt_dev_pg: {}
