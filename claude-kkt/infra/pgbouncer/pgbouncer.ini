; PgBouncer in front of PostgreSQL for the API and the worker (docker-compose.prod.yml; Kubernetes: infra/k8s/pgbouncer.yaml).
; Transaction pooling: a server connection is held only for the duration of a transaction, so hundreds of API worker pools share a
; few dozen Postgres backends. The migrate job and the backup service connect to Postgres directly (session advisory locks, DDL).
;
; Prepared statements: the API runs every query as a named prepared statement (DATABASE_PREPARE=true). PgBouncer >= 1.21 tracks
; protocol-level prepared statements per server connection when max_prepared_statements > 0, so that stays on. With an older
; PgBouncer set DATABASE_PREPARE=false on the API and the worker instead.
;
; Per-connection timeouts: PgBouncer cannot forward the client's startup parameters (statement_timeout, lock_timeout,
; idle_in_transaction_session_timeout) in transaction mode, so they are ignored here and enforced as role defaults of kkt_app
; (infra/postgres/init/01-roles.sql).

[databases]
kkt = host=postgres port=5432 dbname=kkt

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

auth_type = scram-sha-256
; "kkt_app" "<password>" — generated by infra/scripts/gen-secrets.sh, mounted as a Docker/Kubernetes secret
auth_file = /run/secrets/pgbouncer_userlist

pool_mode = transaction
max_prepared_statements = 500

; client side: every API worker pool (replicas x API_WORKERS x DATABASE_POOL_MAX) + the worker + headroom
max_client_conn = 2000
; server side: keep max_db_connections well under Postgres max_connections (200), leaving room for migrate/backup/admin
default_pool_size = 60
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 2
max_db_connections = 150

; a client that cannot get a server connection within 10 s gets an error instead of queueing forever (the API maps it to 503)
query_wait_timeout = 10
server_idle_timeout = 300
server_lifetime = 3600
server_reset_query =
ignore_startup_parameters = extra_float_digits, statement_timeout, lock_timeout, idle_in_transaction_session_timeout, options

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
admin_users =
stats_users = kkt_app
