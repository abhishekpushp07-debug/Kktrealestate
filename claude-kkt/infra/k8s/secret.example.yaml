# TEMPLATE — do not commit real values. Create the Secret from files instead, e.g.
#   kubectl -n kkt create secret generic kkt-secrets --from-file=infra/secrets/   (after sh infra/scripts/gen-secrets.sh, then edit
#   database_url / database_owner_url / redis_url to point at the managed Postgres (via the pgbouncer Service) and Redis)
# or manage it with External Secrets / Sealed Secrets. Keys are file names under /run/secrets in the pods.
apiVersion: v1
kind: Secret
metadata:
  name: kkt-secrets
  namespace: kkt
  labels: { app.kubernetes.io/part-of: kkt }
type: Opaque
stringData:
  jwt_secret: CHANGE-ME-at-least-32-characters-long-random
  field_encryption_key: CHANGE-ME-base64-of-32-random-bytes=
  hash_key: CHANGE-ME-at-least-16-chars
  # the API and the worker go through PgBouncer as kkt_app (DML only)
  database_url: postgres://kkt_app:CHANGE-ME@pgbouncer:6432/kkt
  # the migrate Job talks to Postgres directly as kkt_owner (DDL, session advisory lock)
  database_owner_url: postgres://kkt_owner:CHANGE-ME@postgres:5432/kkt?sslmode=require
  redis_url: rediss://:CHANGE-ME@redis.example.internal:6379/0
  metrics_token: CHANGE-ME-at-least-16-chars
  bootstrap_admin_password: CHANGE-ME-first-admin-password
  pgbouncer_userlist: '"kkt_app" "CHANGE-ME"'
  error_webhook_url: https://hooks.slack.com/services/CHANGE/ME
