# PgBouncer (transaction pooling) between the API/worker pods and the managed Postgres. Same settings as infra/pgbouncer/pgbouncer.ini.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer
  namespace: kkt
  labels: { app.kubernetes.io/name: pgbouncer, app.kubernetes.io/part-of: kkt }
data:
  pgbouncer.ini: |
    [databases]
    kkt = host=postgres port=5432 dbname=kkt
    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    unix_socket_dir =
    auth_type = scram-sha-256
    auth_file = /run/secrets/kkt/pgbouncer_userlist
    pool_mode = transaction
    max_prepared_statements = 500
    max_client_conn = 4000
    ; limits are PER PgBouncer pod: 2 replicas x 70 = 140 server connections, under the 150 the Compose file budgets for one PgBouncer
    ; and well under the managed Postgres max_connections (leave room for the migrate Job, backups and admins). Scale these down when
    ; you add PgBouncer replicas.
    default_pool_size = 30
    min_pool_size = 5
    reserve_pool_size = 5
    reserve_pool_timeout = 2
    max_db_connections = 70
    query_wait_timeout = 10
    server_idle_timeout = 300
    server_lifetime = 3600
    server_reset_query =
    server_tls_sslmode = require
    ignore_startup_parameters = extra_float_digits, statement_timeout, lock_timeout, idle_in_transaction_session_timeout, options
    log_connections = 0
    log_disconnections = 0
    stats_users = kkt_app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: kkt
  labels: { app.kubernetes.io/name: pgbouncer, app.kubernetes.io/part-of: kkt }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: pgbouncer }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pgbouncer, app.kubernetes.io/part-of: kkt }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.24.1-p1
          env:
            - { name: AUTH_FILE, value: /run/secrets/kkt/pgbouncer_userlist }
          ports:
            - { name: pg, containerPort: 6432 }
          readinessProbe:
            tcpSocket: { port: pg }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: pg }
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/pgbouncer/pgbouncer.ini, subPath: pgbouncer.ini, readOnly: true }
            - { name: secrets, mountPath: /run/secrets/kkt, readOnly: true }
            - { name: run, mountPath: /var/run/pgbouncer }
            - { name: log, mountPath: /var/log/pgbouncer }
      volumes:
        - name: config
          configMap: { name: pgbouncer }
        - name: secrets
          secret:
            {
              secretName: kkt-secrets,
              defaultMode: 0440,
              items: [{ key: pgbouncer_userlist, path: pgbouncer_userlist }],
            }
        - name: run
          emptyDir: {}
        - name: log
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: kkt
  labels: { app.kubernetes.io/name: pgbouncer, app.kubernetes.io/part-of: kkt }
spec:
  selector: { app.kubernetes.io/name: pgbouncer }
  ports:
    - { name: pg, port: 6432, targetPort: pg }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer
  namespace: kkt
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pgbouncer }
