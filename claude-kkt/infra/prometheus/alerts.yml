# KKT alert rules (docs/OBSERVABILITY.md has the runbook for each). Validated in CI with `promtool check rules` and unit-tested with
# `promtool test rules infra/prometheus/alerts.test.yml`.
groups:
  - name: kkt-api
    rules:
      - alert: KktApiDown
        expr: up{job="kkt-api"} == 0
        for: 2m
        labels: { severity: critical, component: api }
        annotations:
          summary: "API replica {{ $labels.instance }} is not answering metrics scrapes"
          description: "The container is down or its primary process is stuck. Check `docker compose ps api` / `kubectl get pods`, then the replica's logs."

      - alert: KktApi5xxRateHigh
        expr: |
          sum(rate(http_requests_total{job="kkt-api", status=~"5..", status!="503"}[5m]))
            / sum(rate(http_requests_total{job="kkt-api"}[5m])) > 0.01
        for: 5m
        labels: { severity: warning, component: api }
        annotations:
          summary: "More than 1% of API requests fail with 5xx"
          description: "5xx ratio {{ $value | humanizePercentage }} over 5 minutes. The error webhook carries request ids; search the logs by request_id / trace_id."

      - alert: KktApi5xxRateCritical
        expr: |
          sum(rate(http_requests_total{job="kkt-api", status=~"5..", status!="503"}[5m]))
            / sum(rate(http_requests_total{job="kkt-api"}[5m])) > 0.05
        for: 2m
        labels: { severity: critical, component: api }
        annotations:
          summary: "More than 5% of API requests fail with 5xx"
          description: "5xx ratio {{ $value | humanizePercentage }}. Likely a dependency outage or a bad release: check KktDbDown/KktRedisDown, then roll back."

      - alert: KktApiShedding
        expr: |
          sum(rate(http_requests_total{job="kkt-api", status="503"}[5m]))
            / sum(rate(http_requests_total{job="kkt-api"}[5m])) > 0.05
        for: 10m
        labels: { severity: warning, component: api }
        annotations:
          summary: "The API is shedding load (503) on more than 5% of requests"
          description: "In-flight cap (API_MAX_INFLIGHT) or event-loop pressure. Add replicas/CPU (docs/CAPACITY.md) or look for a slow query holding the pool."

      - alert: KktApiLatencyP95High
        expr: |
          histogram_quantile(0.95, sum by (le, route) (rate(http_request_duration_seconds_bucket{job="kkt-api", route!~"/(api/v1/)?(health|ready|metrics)|unmatched"}[5m]))) > 0.3
          and on (route) sum by (route) (rate(http_requests_total{job="kkt-api"}[5m])) > 0.2
        for: 10m
        labels: { severity: warning, component: api }
        annotations:
          summary: "p95 latency of {{ $labels.route }} is above 300 ms"
          description: "p95 {{ $value | humanizeDuration }} for 10 minutes (target: list pages < 300 ms). Check the route's trace and pg_stat_statements."

      - alert: KktEventLoopLagHigh
        expr: max by (instance) (nodejs_eventloop_lag_p99_seconds{job="kkt-api"}) > 0.5
        for: 5m
        labels: { severity: warning, component: api }
        annotations:
          summary: "Event-loop lag p99 above 500 ms on {{ $labels.instance }}"
          description: "CPU-bound work in the request path (PDF/image rendering, large CSV) or CPU starvation of the container."

      - alert: KktLoginFailuresSpike
        expr: sum by (audience) (rate(logins_failed_total{job="kkt-api"}[5m])) * 60 > 30
        for: 10m
        labels: { severity: warning, component: security }
        annotations:
          summary: "More than 30 failed {{ $labels.audience }} logins per minute"
          description: "Possible credential stuffing. Lockouts and per-IP limits apply; review login_events by IP in the ERP audit pages."

  - name: kkt-jobs
    rules:
      - alert: KktJobFailed
        # job metrics are labelled job_name: the scrape owns `job` (= kkt-api)
        expr: max by (job_name) (kkt_job_failures_24h) > 0
        for: 5m
        labels: { severity: warning, component: jobs }
        annotations:
          summary: "Job {{ $labels.job_name }} failed in the last 24 h"
          description: "{{ $value }} FAILED run(s) in job_runs. ERP → Admin → Jobs shows the error; re-run after fixing (failed runs are retried with backoff first)."

      - alert: KktDailyJobStale
        expr: time() - max by (job_name) (kkt_job_last_success_timestamp_seconds{job_name=~"DAILY_DUES|NIGHTLY_INTEGRITY"}) > 26 * 3600
        for: 15m
        labels: { severity: critical, component: jobs }
        annotations:
          summary: "{{ $labels.job_name }} has not succeeded for more than 26 hours"
          description: "Time-triggered dues or the integrity report did not run. Is the worker container running? Check `docker compose logs worker`."

      - alert: KktJobQueueBacklog
        expr: max(kkt_jobs_queue_depth{state="wait"}) > 100
        for: 15m
        labels: { severity: warning, component: jobs }
        annotations:
          summary: "More than 100 jobs waiting in the queue"
          description: "The worker is down or too slow (exports, backups). Check the worker logs; scale is one worker by design, so look for a stuck job."

  - name: kkt-data
    rules:
      - alert: KktIntegrityFindings
        expr: max(kkt_integrity_findings) > 0
        for: 5m
        labels: { severity: critical, component: money }
        annotations:
          summary: "The integrity report has {{ $value }} finding(s)"
          description: "Ledger/summary/demand mismatches. ERP → Admin → Integrity lists them; repair is audited. Money is never auto-corrected."

      - alert: KktIntegrityReportStale
        expr: time() - max(kkt_integrity_last_run_timestamp_seconds) > 26 * 3600
        for: 15m
        labels: { severity: warning, component: money }
        annotations:
          summary: "No integrity report for more than 26 hours"
          description: "NIGHTLY_INTEGRITY did not run; see KktDailyJobStale."

      - alert: KktBackupStale
        expr: time() - max(kkt_backup_last_success_timestamp_seconds) > 26 * 3600
        for: 15m
        labels: { severity: critical, component: backup }
        annotations:
          summary: "No successful database backup (dump + restore drill) for more than 26 hours"
          description: "Check `docker compose logs backup` (docs/RESTORE.md). WAL archiving keeps PITR possible meanwhile — verify /backups/wal is growing."

  - name: kkt-dependencies
    rules:
      - alert: KktDbDown
        expr: max(kkt_db_up) == 0
        for: 1m
        labels: { severity: critical, component: database }
        annotations:
          summary: "The API cannot query Postgres"
          description: "Readiness fails, so the load balancer stops sending traffic. Check postgres and pgbouncer containers."

      - alert: KktDbPoolSaturation
        # every API replica reports the same database-wide pg_stat_activity counts: de-duplicate across instances (max), then add the states
        expr: sum(max by (state) (kkt_db_connections)) / max(kkt_db_max_connections) > 0.8
        for: 5m
        labels: { severity: warning, component: database }
        annotations:
          summary: "Postgres connections above 80% of max_connections"
          description: "{{ $value | humanizePercentage }} in use. Lower DATABASE_POOL_MAX × workers × replicas, or route through PgBouncer (docs/CAPACITY.md)."

      - alert: KktDbActiveConnectionsHigh
        expr: max(kkt_db_connections{state="active"}) > 0.5 * max(kkt_db_max_connections)
        for: 5m
        labels: { severity: warning, component: database }
        annotations:
          summary: "More than half of Postgres max_connections are executing queries"
          description: "Queries are queueing in the database (slow query, lock wait). Look at pg_stat_activity and pg_stat_statements."

      - alert: KktRedisDown
        expr: max(kkt_redis_up) == 0 or max(redis_up) == 0
        for: 1m
        labels: { severity: critical, component: redis }
        annotations:
          summary: "Redis is unreachable"
          description: "Authentication falls back to the database, but rate limits, caches and the job queue are degraded. Restart redis; data is on the AOF volume."

      - alert: KktRedisMemoryHigh
        expr: max(redis_memory_used_bytes / redis_memory_max_bytes) > 0.85 and max(redis_memory_max_bytes) > 0
        for: 10m
        labels: { severity: warning, component: redis }
        annotations:
          summary: "Redis memory above 85% of maxmemory"
          description: "Redis runs with noeviction: at 100% writes fail. Raise REDIS_MAXMEMORY or move caches to a separate instance."

  - name: kkt-host
    rules:
      - alert: KktDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.15
        for: 10m
        labels: { severity: warning, component: host }
        annotations:
          summary: "Less than 15% disk free on {{ $labels.mountpoint }}"
          description: "WAL archive, dumps and Docker logs grow here. Check backup retention (DUMP_RETENTION_DAYS, BASE_BACKUPS_KEEP)."

      - alert: KktDiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.05
        for: 5m
        labels: { severity: critical, component: host }
        annotations:
          summary: "Less than 5% disk free on {{ $labels.mountpoint }}"
          description: "Postgres stops accepting writes when its disk is full. Free space now (old dumps, docker image prune)."

      - alert: KktDiskWillFillIn24h
        expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
        for: 30m
        labels: { severity: warning, component: host }
        annotations:
          summary: "{{ $labels.mountpoint }} will be full within 24 hours at the current rate"
          description: "Usually a stuck WAL archive cleanup or runaway logs."
