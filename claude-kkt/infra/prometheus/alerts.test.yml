# promtool test rules infra/prometheus/alerts.test.yml   (CI: .github/workflows/ci.yml "infra" job)
rule_files: [alerts.yml]
evaluation_interval: 30s
tests:
  - interval: 30s
    input_series:
      # 3% of requests fail with 500 (503 load shedding does not count)
      - series: 'http_requests_total{job="kkt-api", route="/api/v1/bookings", method="GET", status="200"}'
        values: "0+97x40"
      - series: 'http_requests_total{job="kkt-api", route="/api/v1/bookings", method="GET", status="500"}'
        values: "0+3x40"
      - series: 'http_requests_total{job="kkt-api", route="/api/v1/bookings", method="GET", status="503"}'
        values: "0+50x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: KktApi5xxRateHigh
        exp_alerts:
          - exp_labels: { severity: warning, component: api }
            exp_annotations:
              summary: "More than 1% of API requests fail with 5xx"
              description: "5xx ratio 2% over 5 minutes. The error webhook carries request ids; search the logs by request_id / trace_id."
      - eval_time: 15m
        alertname: KktApi5xxRateCritical
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'kkt_integrity_findings{job="kkt-api", instance="api-1"}'
        values: "0 0 2 2 2 2 2 2 2 2"
      # as scraped: the target label job="kkt-api" next to the metric's own job_name
      - series: 'kkt_job_failures_24h{job="kkt-api", job_name="DAILY_DUES", instance="api-1"}'
        values: "1x10"
      - series: 'kkt_db_up{job="kkt-api", instance="api-1"}'
        values: "1 1 0 0 0 0"
    alert_rule_test:
      - eval_time: 9m
        alertname: KktIntegrityFindings
        exp_alerts:
          - exp_labels: { severity: critical, component: money }
            exp_annotations:
              summary: "The integrity report has 2 finding(s)"
              description: "Ledger/summary/demand mismatches. ERP → Admin → Integrity lists them; repair is audited. Money is never auto-corrected."
      - eval_time: 9m
        alertname: KktJobFailed
        exp_alerts:
          - exp_labels: { severity: warning, component: jobs, job_name: DAILY_DUES }
            exp_annotations:
              summary: "Job DAILY_DUES failed in the last 24 h"
              description: "1 FAILED run(s) in job_runs. ERP → Admin → Jobs shows the error; re-run after fixing (failed runs are retried with backoff first)."
      - eval_time: 5m
        alertname: KktDbDown
        exp_alerts:
          - exp_labels: { severity: critical, component: database }
            exp_annotations:
              summary: "The API cannot query Postgres"
              description: "Readiness fails, so the load balancer stops sending traffic. Check postgres and pgbouncer containers."

  - interval: 1m
    input_series:
      # slow route: every request takes ~0.6 s; a fast route stays under 50 ms
      - series: 'http_request_duration_seconds_bucket{job="kkt-api", route="/api/v1/bookings", method="GET", status="200", le="0.3"}'
        values: "0+0x20"
      - series: 'http_request_duration_seconds_bucket{job="kkt-api", route="/api/v1/bookings", method="GET", status="200", le="1"}'
        values: "0+60x20"
      - series: 'http_request_duration_seconds_bucket{job="kkt-api", route="/api/v1/bookings", method="GET", status="200", le="+Inf"}'
        values: "0+60x20"
      - series: 'http_requests_total{job="kkt-api", route="/api/v1/bookings", method="GET", status="200"}'
        values: "0+60x20"
      - series: 'http_request_duration_seconds_bucket{job="kkt-api", route="/api/v1/projects", method="GET", status="200", le="0.05"}'
        values: "0+60x20"
      - series: 'http_request_duration_seconds_bucket{job="kkt-api", route="/api/v1/projects", method="GET", status="200", le="+Inf"}'
        values: "0+60x20"
      - series: 'http_requests_total{job="kkt-api", route="/api/v1/projects", method="GET", status="200"}'
        values: "0+60x20"
      - series: 'kkt_backup_last_success_timestamp_seconds{job="node"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: KktApiLatencyP95High
        exp_alerts:
          - exp_labels: { severity: warning, component: api, route: /api/v1/bookings }
            exp_annotations:
              summary: "p95 latency of /api/v1/bookings is above 300 ms"
              description: "p95 965ms for 10 minutes (target: list pages < 300 ms). Check the route's trace and pg_stat_statements."
      - eval_time: 20m
        alertname: KktBackupStale
        exp_alerts: []

  # a daily job that stopped succeeding (labels as scraped: job is the target, job_name the job)
  - interval: 1m
    input_series:
      - series: 'kkt_job_last_success_timestamp_seconds{job="kkt-api", job_name="DAILY_DUES", instance="api-1"}'
        values: "0x1700"
      - series: 'kkt_job_last_success_timestamp_seconds{job="kkt-api", job_name="NIGHTLY_INTEGRITY", instance="api-1"}'
        values: "100000x1700"
    alert_rule_test:
      - eval_time: 28h
        alertname: KktDailyJobStale
        exp_alerts:
          - exp_labels: { severity: critical, component: jobs, job_name: DAILY_DUES }
            exp_annotations:
              summary: "DAILY_DUES has not succeeded for more than 26 hours"
              description: "Time-triggered dues or the integrity report did not run. Is the worker container running? Check `docker compose logs worker`."

  # two API replicas report the same database-wide connection counts: 90 + 60 of 200 is 75% (no alert), 120 + 60 is 90% (alert);
  # summing across replicas would have doubled both
  - interval: 1m
    input_series:
      - series: 'kkt_db_connections{job="kkt-api", instance="api-1", state="active"}'
        values: "90x10 120x10"
      - series: 'kkt_db_connections{job="kkt-api", instance="api-2", state="active"}'
        values: "90x10 120x10"
      - series: 'kkt_db_connections{job="kkt-api", instance="api-1", state="idle"}'
        values: "60x20"
      - series: 'kkt_db_connections{job="kkt-api", instance="api-2", state="idle"}'
        values: "60x20"
      - series: 'kkt_db_max_connections{job="kkt-api", instance="api-1"}'
        values: "200x20"
      - series: 'kkt_db_max_connections{job="kkt-api", instance="api-2"}'
        values: "200x20"
    alert_rule_test:
      - eval_time: 9m
        alertname: KktDbPoolSaturation
        exp_alerts: []
      - eval_time: 19m
        alertname: KktDbPoolSaturation
        exp_alerts:
          - exp_labels: { severity: warning, component: database }
            exp_annotations:
              summary: "Postgres connections above 80% of max_connections"
              description: "90% in use. Lower DATABASE_POOL_MAX × workers × replicas, or route through PgBouncer (docs/CAPACITY.md)."

  # ---- phase 7 alerts (worker heartbeat C8, dues isolation, client errors C2, process errors, storage sweep, audit seal, paging) ----

  # worker heartbeat: advancing, then stuck at 600 s from minute 10 (Redis writes failing while /metrics still answers)
  - interval: 1m
    input_series:
      - series: kkt_worker_heartbeat_timestamp_seconds{job="kkt-worker", instance="worker-1"}
        values: 0+60x10 600x10
    alert_rule_test:
      - eval_time: 9m
        alertname: KktWorkerHeartbeatStale
        exp_alerts: []
      - eval_time: 16m
        alertname: KktWorkerHeartbeatStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: jobs
            exp_annotations:
              summary: No job worker heartbeat for more than a minute
              description: "Nothing consumes the job queues: daily dues, integrity, audit seal, notifications and backups stop. Check `docker compose ps worker` / `kubectl -n kkt get pods -l app.kubernetes.io/name=worker`, GET :9465/health and the worker logs."

  # every worker gone: the last scrape is at minute 5; the stale value then absent() keep the alert firing
  - interval: 1m
    input_series:
      - series: kkt_worker_heartbeat_timestamp_seconds{job="kkt-worker", instance="worker-1"}
        values: 0+60x5
    alert_rule_test:
      - eval_time: 4m
        alertname: KktWorkerHeartbeatStale
        exp_alerts: []
      - eval_time: 9m
        alertname: KktWorkerHeartbeatStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: jobs
            exp_annotations:
              summary: No job worker heartbeat for more than a minute
              description: "Nothing consumes the job queues: daily dues, integrity, audit seal, notifications and backups stop. Check `docker compose ps worker` / `kubectl -n kkt get pods -l app.kubernetes.io/name=worker`, GET :9465/health and the worker logs."
      - eval_time: 14m
        alertname: KktWorkerHeartbeatStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: jobs
            exp_annotations:
              summary: No job worker heartbeat for more than a minute
              description: "Nothing consumes the job queues: daily dues, integrity, audit seal, notifications and backups stop. Check `docker compose ps worker` / `kubectl -n kkt get pods -l app.kubernetes.io/name=worker`, GET :9465/health and the worker logs."

  # one of the two workers hangs: its target stays (scrapes fail, up = 0)
  - interval: 1m
    input_series:
      - series: up{job="kkt-worker", instance="worker-1"}
        values: 1x15
      - series: up{job="kkt-worker", instance="worker-2"}
        values: 1 1 1 0x12
      - series: kkt_worker_heartbeat_timestamp_seconds{job="kkt-worker", instance="worker-1"}
        values: 0+60x15
    alert_rule_test:
      - eval_time: 6m
        alertname: KktWorkerReplicaDown
        exp_alerts: []
      - eval_time: 12m
        alertname: KktWorkerReplicaDown
        exp_alerts:
          - exp_labels:
              severity: warning
              component: jobs
            exp_annotations:
              summary: Only 1 job worker(s) answering, fewer than in the last 6 hours
              description: The remaining replicas keep the queues moving; restore the missing one before it is needed (docker compose ps worker / kubectl -n kkt get pods -l app.kubernetes.io/name=worker). After an intentional scale-down this clears within 6 hours.
      - eval_time: 12m
        alertname: KktWorkerHeartbeatStale
        exp_alerts: []

  # one of the two workers is stopped: service discovery drops its target (no up series at all after minute 10 + the 5 m lookback)
  - interval: 1m
    input_series:
      - series: up{job="kkt-worker", instance="worker-1"}
        values: 1x40
      - series: up{job="kkt-worker", instance="worker-2"}
        values: 1x10
      - series: kkt_worker_heartbeat_timestamp_seconds{job="kkt-worker", instance="worker-1"}
        values: 0+60x40
    alert_rule_test:
      - eval_time: 12m
        alertname: KktWorkerReplicaDown
        exp_alerts: []
      - eval_time: 30m
        alertname: KktWorkerReplicaDown
        exp_alerts:
          - exp_labels:
              severity: warning
              component: jobs
            exp_annotations:
              summary: Only 1 job worker(s) answering, fewer than in the last 6 hours
              description: The remaining replicas keep the queues moving; restore the missing one before it is needed (docker compose ps worker / kubectl -n kkt get pods -l app.kubernetes.io/name=worker). After an intentional scale-down this clears within 6 hours.

  # DAILY_DUES per-booking failures: a code's first failure (new series) and an increment of an existing series both alert
  - interval: 1m
    input_series:
      - series: kkt_dues_booking_failures_total{job="kkt-worker", instance="worker-1", code="BOOKING_LOCKED"}
        values: _x30 1x30
      - series: kkt_dues_booking_failures_total{job="kkt-worker", instance="worker-2", code="PLAN_MISSING"}
        values: 0x20 3x30
    alert_rule_test:
      - eval_time: 10m
        alertname: KktDuesBookingFailures
        exp_alerts: []
      - eval_time: 45m
        alertname: KktDuesBookingFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              component: money
              code: BOOKING_LOCKED
            exp_annotations:
              summary: DAILY_DUES skipped bookings in the last 24 h (BOOKING_LOCKED)
              description: Those bookings got no installment demands. ERP → Admin → Jobs → DAILY_DUES lists them (bookings_failed); fix the data, then re-run the job.
          - exp_labels:
              severity: warning
              component: money
              code: PLAN_MISSING
            exp_annotations:
              summary: DAILY_DUES skipped bookings in the last 24 h (PLAN_MISSING)
              description: Those bookings got no installment demands. ERP → Admin → Jobs → DAILY_DUES lists them (bookings_failed); fix the data, then re-run the job.

  # a counter unchanged for more than a day does not alert; a fresh increment does
  - interval: 1m
    input_series:
      - series: kkt_dues_booking_failures_total{job="kkt-worker", instance="worker-1", code="OLD"}
        values: 3x1500
      - series: kkt_dues_booking_failures_total{job="kkt-worker", instance="worker-1", code="NEW"}
        values: 0x1480 1x20
    alert_rule_test:
      - eval_time: 25h
        alertname: KktDuesBookingFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              component: money
              code: NEW
            exp_annotations:
              summary: DAILY_DUES skipped bookings in the last 24 h (NEW)
              description: Those bookings got no installment demands. ERP → Admin → Jobs → DAILY_DUES lists them (bookings_failed); fix the data, then re-run the job.

  # front-end errors: 20/min from the ERP alerts, 2/min from the portal does not
  - interval: 1m
    input_series:
      - series: kkt_client_errors_total{job="kkt-api", instance="api-1", app="erp"}
        values: 0+20x40
      - series: kkt_client_errors_total{job="kkt-api", instance="api-1", app="portal"}
        values: 0+2x40
    alert_rule_test:
      - eval_time: 8m
        alertname: KktClientErrorRateHigh
        exp_alerts: []
      - eval_time: 30m
        alertname: KktClientErrorRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              component: frontend
              app: erp
            exp_annotations:
              summary: More than 10 front-end errors per minute from the erp app
              description: Usually a bad release of that app or an API contract change it does not handle. Search the API logs for msg "client error reported" with client_error.app=erp (release, url and stack are in the line); roll the app back if it started with a deploy.

  # process errors: the first unhandled rejection of a process alerts; ten quiet minutes later it resolves
  - interval: 1m
    input_series:
      - series: kkt_process_errors_total{job="kkt-worker", instance="worker-1", role="worker", kind="unhandled_rejection"}
        values: _x10 1x20
    alert_rule_test:
      - eval_time: 15m
        alertname: KktProcessErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              component: api
              role: worker
              kind: unhandled_rejection
            exp_annotations:
              summary: unhandled_rejection in the worker process
              description: A promise rejection or exception escaped every handler. The log line carries the stack; an uncaught exception restarts the process.
      - eval_time: 28m
        alertname: KktProcessErrors
        exp_alerts: []

  # storage deletions that gave up (other sweep actions do not count)
  - interval: 1m
    input_series:
      - series: kkt_storage_sweep_objects_total{job="kkt-worker", instance="worker-1", action="deletion_gave_up"}
        values: _x5 1x20
      - series: kkt_storage_sweep_objects_total{job="kkt-worker", instance="worker-1", action="deletion_done"}
        values: 0+5x25
    alert_rule_test:
      - eval_time: 3m
        alertname: KktStorageDeletionGaveUp
        exp_alerts: []
      - eval_time: 15m
        alertname: KktStorageDeletionGaveUp
        exp_alerts:
          - exp_labels:
              severity: warning
              component: storage
            exp_annotations:
              summary: Object-store deletions failed 10 or more times
              description: STORAGE_SWEEP keeps retrying daily, but erased or orphaned files are still in the bucket (DPDP erasure may be incomplete). Check the bucket credentials/policy and the worker logs.

  # audit seal: a failed attempt that the next run fixes does not page (kkt_job_failures_24h stays at 1 for a day, but the seal keeps
  # succeeding every 15 minutes)
  - interval: 1m
    input_series:
      - series: kkt_job_failures_24h{job="kkt-api", instance="api-1", job_name="AUDIT_SEAL"}
        values: 0 0 1x60
      - series: kkt_job_last_success_timestamp_seconds{job="kkt-api", instance="api-1", job_name="AUDIT_SEAL"}
        values: 0x14 900x14 1800x14 2700x14
    alert_rule_test:
      - eval_time: 10m
        alertname: KktAuditSealFailed
        exp_alerts: []
      - eval_time: 55m
        alertname: KktAuditSealFailed
        exp_alerts: []

  # audit seal: failures and no successful seal for more than 30 minutes (two scheduled runs) pages; no success for an hour also warns
  - interval: 1m
    input_series:
      - series: kkt_job_failures_24h{job="kkt-api", instance="api-1", job_name="AUDIT_SEAL"}
        values: 0 0 1x100
      - series: kkt_job_last_success_timestamp_seconds{job="kkt-api", instance="api-1", job_name="AUDIT_SEAL"}
        values: "0x100"
    alert_rule_test:
      - eval_time: 10m
        alertname: KktAuditSealFailed
        exp_alerts: []
      - eval_time: 33m
        alertname: KktAuditSealFailed
        exp_alerts: []
      - eval_time: 40m
        alertname: KktAuditSealFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              component: security
              job_name: AUDIT_SEAL
            exp_annotations:
              summary: The audit-log seal job failed
              description: "Run GET /api/v1/admin/audit/verify for each company: first_mismatch names the changed, removed or back-dated row. Treat a chain break as a security incident."
      - eval_time: 40m
        alertname: KktAuditSealStale
        exp_alerts: []
      - eval_time: 90m
        alertname: KktAuditSealStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: security
            exp_annotations:
              summary: No successful audit-log seal for more than an hour
              description: AUDIT_SEAL runs every 15 minutes; unsealed audit rows are not tamper-evident yet. Check the workers (KktWorkerHeartbeatStale) and the job's last error.

  # audit seal: a seal that never succeeded (no success series at all) pages too
  - interval: 1m
    input_series:
      - series: kkt_job_failures_24h{job="kkt-api", instance="api-1", job_name="AUDIT_SEAL"}
        values: 1x20
    alert_rule_test:
      - eval_time: 3m
        alertname: KktAuditSealFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: KktAuditSealFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              component: security
              job_name: AUDIT_SEAL
            exp_annotations:
              summary: The audit-log seal job failed
              description: "Run GET /api/v1/admin/audit/verify for each company: first_mismatch names the changed, removed or back-dated row. Treat a chain break as a security incident."

  # base backups (backup.sh status.prom): the newest is 691,000 s (8 days minus 200 s) older than the test clock's epoch, so it crosses
  # 8 days at 200 s and the alert fires an hour later; a base backup that keeps pace with the clock never alerts
  - interval: 1m
    input_series:
      - series: kkt_backup_last_base_backup_timestamp_seconds{job="node", instance="node-exporter:9100"}
        values: "-691000x130"
    alert_rule_test:
      - eval_time: 30m
        alertname: KktBaseBackupStale
        exp_alerts: []
      - eval_time: 2h
        alertname: KktBaseBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: backup
            exp_annotations:
              summary: No base backup for more than 8 days
              description: 'Point-in-time recovery needs a recent base backup plus the WAL archived since. Look for "pg_basebackup FAILED" in `docker compose logs backup`, fix the cause and take one now: `docker compose exec backup sh /opt/kkt/backup.sh base` (docs/RESTORE.md).'
  - interval: 1m
    input_series:
      - series: kkt_backup_last_base_backup_timestamp_seconds{job="node", instance="node-exporter:9100"}
        values: "0+60x130"
    alert_rule_test:
      - eval_time: 2h
        alertname: KktBaseBackupStale
        exp_alerts: []

  # Alertmanager cannot deliver pages
  - interval: 1m
    input_series:
      - series: alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="pagerduty"}
        values: 0+1x40
      - series: alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="slack"}
        values: "0x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: KktAlertmanagerNotificationsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: alerting
              integration: pagerduty
            exp_annotations:
              summary: Alertmanager cannot deliver pagerduty notifications
              description: Check the receiver's key file (infra/secrets/pagerduty_routing_key / opsgenie_api_key / error_webhook_url) and `docker compose logs alertmanager`.
