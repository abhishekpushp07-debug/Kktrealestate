# Tuned for a 4 vCPU / 8 GB node. Scale with the box.
listen_addresses = '*'
max_connections = 200
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 256MB
wal_buffers = 64MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100
log_min_duration_statement = 300
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all

# --- Durability / backups (docs/RESTORE.md). docker-compose.prod.yml turns WAL archiving on with -c flags:
#   archive_mode=on, archive_command copies each completed segment to the backup volume (/backups/wal), archive_timeout=300
#   so at most 5 minutes of committed transactions are outside the archive. wal_level=replica (the default) is required.
wal_level = replica
max_wal_senders = 5
password_encryption = scram-sha-256
# statements of the application role that hit a lock wait or run long show up in the log
log_lock_waits = on
log_temp_files = 0
