# Client authentication for the production Postgres container (docker-compose.prod.yml mounts this as hba_file).
# Every network login uses SCRAM; the database is only reachable on the internal Compose network (no published port).
# TYPE  DATABASE        USER            ADDRESS         METHOD
local   all             all                             trust
host    all             all             127.0.0.1/32    scram-sha-256
host    all             all             ::1/128         scram-sha-256
# pg_basebackup from the backup service (physical base backups for point-in-time recovery)
host    replication     postgres        all             scram-sha-256
# API/worker via PgBouncer (kkt_app), the migrate job (kkt_owner), the backup service and admins (postgres)
host    all             all             all             scram-sha-256
