# Staff ERP (static Vite build). Rendered by the nginx image from /etc/nginx/templates/default.conf.template: ${CSP_CONNECT_SRC} is
# substituted at container start (Dockerfile default "'self'": the API is same-origin under /api behind Caddy or the Ingress).
# HSTS is set by the TLS terminator (infra/caddy/Caddyfile, infra/k8s/ingress.yaml).
map $uri $kkt_cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header Cache-Control $kkt_cache_control always;
  # The ERP keeps its session in the browser, so script injection and framing are shut out: scripts only from this origin, no inline
  # script, no framing by anyone, no plugins. Styles allow 'unsafe-inline' for Radix/sonner runtime style tags; fonts from Google Fonts.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src ${CSP_CONNECT_SRC}; frame-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
