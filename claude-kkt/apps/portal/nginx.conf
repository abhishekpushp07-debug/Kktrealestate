# Customer portal (Expo static web export). Rendered by the nginx image from /etc/nginx/templates/default.conf.template:
# ${CSP_CONNECT_SRC} is substituted at container start (Dockerfile default "'self'": the API is same-origin under /api).
# HSTS is set by the TLS terminator (infra/caddy/Caddyfile, infra/k8s/ingress.yaml).
map $uri $kkt_cache_control {
  ~^/assets/        "public, max-age=31536000, immutable";
  ~^/_expo/static/  "public, max-age=31536000, immutable";
  default           "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header Cache-Control $kkt_cache_control always;
  # script-src: this origin plus the one inline hydration flag Expo Router writes into every page
  # (globalThis.__EXPO_ROUTER_HYDRATE__=true; — recompute the hash if an Expo upgrade changes it: docs/DEPLOY.md "CSP").
  # style-src 'unsafe-inline': react-native-web injects its styles at runtime.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-67fhrP0+BkBqmgGGXTtgiVO/9EQs3QruYNU/7fnRkI8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src ${CSP_CONNECT_SRC}; frame-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location /assets/ { try_files $uri =404; }
  location /_expo/ { try_files $uri =404; }
  # static export: /payments → payments.html; unknown paths fall back to the SPA shell
  location / { try_files $uri $uri.html $uri/index.html /index.html; }
}
