# Production stack on one or more Docker hosts (docs/DEPLOY.md "Production with Docker Compose"). Differences from the quick start:
#   * every secret is a file (./infra/secrets, generated by infra/scripts/gen-secrets.sh) passed as *_FILE, never an environment value;
#   * the API and the worker reach Postgres through PgBouncer (transaction pooling) as kkt_app (DML only); the one-shot migrate service
#     talks to Postgres directly as kkt_owner, and the API replicas start only after it completed;
#   * object storage is S3-compatible by default (AWS S3, Cloudflare R2, or the bundled MinIO with `--profile minio`);
#   * Redis is persistent and never evicts (optional dedicated security Redis with `--profile security-redis`);
#   * Postgres archives WAL to the backup volume and the backup service takes nightly dumps (restore-tested) + weekly base backups, all
#     encrypted (age; infra/backup/backup.sh, image infra/backup/Dockerfile);
#   * two job workers (contract C8 health on :9465, drained on stop within WORKER_DRAIN_TIMEOUT_MS);
#   * Prometheus + Alertmanager (critical → pager, warnings → Slack) + Grafana + exporters with `--profile monitoring`.
#   * images are immutable tags: IMAGE_TAG (the git SHA CI pushed, or a release) is required; KKT_IMAGE_PREFIX names the registry
#     (default "kkt" = images built on this host with `--build`). Rollback = the previous IMAGE_TAG (docs/DEPLOY.md).
#
#   sh infra/scripts/gen-secrets.sh infra/secrets
#   cp .env.example .env   # DOMAIN, IMAGE_TAG, S3_*, BOOTSTRAP_COMPANY_NAME, BOOTSTRAP_ADMIN_EMAIL, … (no secrets in .env)
#   docker compose -f docker-compose.prod.yml --profile monitoring up -d --build

x-secret-env: &secret-env
  JWT_SECRET_FILE: /run/secrets/jwt_secret
  FIELD_ENCRYPTION_KEY_FILE: /run/secrets/field_encryption_key
  HASH_KEY_FILE: /run/secrets/hash_key
  # key rings (contract C9; first entry active, older ones verify/look up only — rotation in docs/DEPLOY.md)
  JWT_SIGNING_KEYS_FILE: /run/secrets/jwt_signing_keys
  LINK_SIGNING_KEYS_FILE: /run/secrets/link_signing_keys
  HASH_KEYS_FILE: /run/secrets/hash_keys
  INTERNAL_API_TOKEN_FILE: /run/secrets/internal_api_token
  WEB_REVALIDATE_TOKEN_FILE: /run/secrets/web_revalidate_token
  REDIS_URL_FILE: /run/secrets/redis_url
  METRICS_TOKEN_FILE: /run/secrets/metrics_token
  # set these in .env only when the option is used (empty = unset)
  REDIS_SECURITY_URL_FILE: ${KKT_REDIS_SECURITY_URL_FILE:-}
  S3_ACCESS_KEY_FILE: ${KKT_S3_ACCESS_KEY_FILE:-}
  S3_SECRET_KEY_FILE: ${KKT_S3_SECRET_KEY_FILE:-}
  ERROR_WEBHOOK_URL_FILE: ${KKT_ERROR_WEBHOOK_URL_FILE:-}

x-api-env: &api-env
  <<: *secret-env
  NODE_ENV: production
  API_PUBLIC_URL: https://erp.${DOMAIN:?set DOMAIN}
  ERP_ORIGIN: https://erp.${DOMAIN}
  WEB_ORIGIN: https://www.${DOMAIN}
  PORTAL_ORIGIN: https://my.${DOMAIN}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
  STORAGE_LOCAL_DIR: /data/storage
  S3_BUCKET: ${S3_BUCKET:-kkt-documents}
  S3_REGION: ${S3_REGION:-ap-south-1}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  TRUST_PROXY: uniquelocal
  RUN_MIGRATIONS_ON_BOOT: "false"
  SEED_ON_BOOT: "false"
  SEED_DEMO: "false"
  RUN_JOBS_IN_API: "false"
  # PgBouncer >= 1.21 with max_prepared_statements keeps named prepared statements working in transaction mode
  DATABASE_PREPARE: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_SERVICE_NAME: kkt-api
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # libuv pool shared by argon2, sharp, zlib and fs (default 4 is too small; set before the pool starts, apps/api/src/preload.ts)
  UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-16}
  # the website's on-demand revalidation after CMS / project-website writes (best-effort; token = web_revalidate_token)
  WEB_REVALIDATE_URL: http://web:3000/api/revalidate
  GIT_SHA: ${IMAGE_TAG:?set IMAGE_TAG (the image tag to run, e.g. the git SHA CI pushed)}

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    # postgres:16-alpine + age (infra/backup/Dockerfile): archive_command encrypts every WAL segment before it reaches /backups
    build: { context: ./infra/backup }
    image: kkt-backup:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: kkt
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_encryption_key
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      # continuous, encrypted WAL archiving to the backup volume (point-in-time recovery: docs/RESTORE.md)
      - -c
      - archive_mode=on
      - -c
      - archive_command=sh /opt/kkt/backup.sh wal-push %p %f
      - -c
      - archive_timeout=300
    secrets: [postgres_password, kkt_owner_db_password, kkt_app_db_password, backup_encryption_key]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - backups:/backups
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    depends_on: { backup-init: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d kkt"], interval: 5s, timeout: 3s, retries: 30 }
    shm_size: 512mb
    stop_grace_period: 60s
    logging: *logging
    restart: unless-stopped

  # creates the backup directories with Postgres' uid (70 in the alpine image) before Postgres archives into them
  backup-init:
    image: alpine:3.20
    command:
      [
        "sh",
        "-c",
        "mkdir -p /backups/wal /backups/dumps /backups/base && chown -R 70:70 /backups && chmod 700 /backups/wal",
      ]
    volumes: ["backups:/backups"]
    restart: "no"

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    environment:
      AUTH_FILE: /run/secrets/pgbouncer_userlist
    volumes:
      - ./infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    secrets: [pgbouncer_userlist]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      { test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"], interval: 5s, timeout: 3s, retries: 20 }
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # persistent (AOF, fsync every second) and never evicting: revocation markers, rate limits, locks and the job queue live here
    command:
      [
        "sh",
        "-c",
        'exec redis-server --requirepass "$$(cat /run/secrets/redis_password)" --appendonly yes --appendfsync everysec --maxmemory ${REDIS_MAXMEMORY:-1gb} --maxmemory-policy noeviction',
      ]
    secrets: [redis_password]
    volumes: ["redisdata:/data"]
    healthcheck:
      {
        test: ["CMD-SHELL", 'redis-cli -a "$$(cat /run/secrets/redis_password)" --no-auth-warning ping | grep -q PONG'],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
    logging: *logging
    restart: unless-stopped

  # optional dedicated Redis for security state (REDIS_SECURITY_URL): enable with --profile security-redis and set
  # KKT_REDIS_SECURITY_URL_FILE=/run/secrets/redis_security_url in .env
  redis-security:
    image: redis:7-alpine
    profiles: ["security-redis"]
    command:
      [
        "sh",
        "-c",
        'exec redis-server --requirepass "$$(cat /run/secrets/redis_password)" --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction',
      ]
    secrets: [redis_password]
    volumes: ["redissecurity:/data"]
    healthcheck:
      {
        test: ["CMD-SHELL", 'redis-cli -a "$$(cat /run/secrets/redis_password)" --no-auth-warning ping | grep -q PONG'],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
    logging: *logging
    restart: unless-stopped

  # S3-compatible object storage on the same hosts (with S3_ENDPOINT=http://minio:9000); use AWS S3 / R2 for real durability
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/s3_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_key
    secrets: [s3_access_key, s3_secret_key]
    volumes: ["miniodata:/data"]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 10s, timeout: 5s, retries: 10 }
    logging: *logging
    restart: unless-stopped

  # one-shot: migrations as kkt_owner directly against Postgres (session advisory lock, DDL), then the first-boot seed; exits 0
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: ${KKT_IMAGE_PREFIX:-kkt}-api:${IMAGE_TAG:?set IMAGE_TAG}
    command: ["node", "dist/server.js", "migrate"]
    environment:
      <<: *api-env
      DATABASE_URL_FILE: /run/secrets/database_owner_url
      SEED_ON_BOOT: "true"
      SEED_DEMO: ${SEED_DEMO:-false}
      BOOTSTRAP_COMPANY_NAME: ${BOOTSTRAP_COMPANY_NAME:-}
      # required (and kept in .env after the first boot): the bootstrap password file is always mounted, and the configuration
      # refuses BOOTSTRAP_ADMIN_PASSWORD without BOOTSTRAP_ADMIN_EMAIL, so an unset e-mail would fail every later migrate run
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?set BOOTSTRAP_ADMIN_EMAIL in .env (the first Super Admin; keep it set)}
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
    secrets:
      [
        jwt_secret,
        jwt_signing_keys,
        link_signing_keys,
        hash_keys,
        field_encryption_key,
        hash_key,
        internal_api_token,
        web_revalidate_token,
        redis_url,
        redis_security_url,
        metrics_token,
        s3_access_key,
        s3_secret_key,
        error_webhook_url,
        database_owner_url,
        bootstrap_admin_password,
      ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging: *logging
    restart: "no"

  api:
    image: ${KKT_IMAGE_PREFIX:-kkt}-api:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      <<: *api-env
      DATABASE_URL_FILE: /run/secrets/database_url
      # one HTTP worker per CPU of the container (Node reads the cgroup CPU limit); pool per worker, multiplexed by PgBouncer
      API_WORKERS: ${API_WORKERS:-auto}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      API_MAX_INFLIGHT: ${API_MAX_INFLIGHT:-256}
      SHUTDOWN_TIMEOUT_MS: "25000"
      SHUTDOWN_DRAIN_DELAY_MS: "6000"
    secrets:
      [
        jwt_secret,
        jwt_signing_keys,
        link_signing_keys,
        hash_keys,
        field_encryption_key,
        hash_key,
        internal_api_token,
        web_revalidate_token,
        redis_url,
        redis_security_url,
        metrics_token,
        s3_access_key,
        s3_secret_key,
        error_webhook_url,
        database_url,
      ]
    # liveness only (the process answers HTTP); dependency outages show in /api/v1/health/ready and /api/v1/health, not here
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:4000/api/v1/health/live || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 40s
      retries: 3
    volumes: ["storage:/data/storage"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources: { limits: { cpus: "${API_CPUS:-2}", memory: 2g } }
    stop_grace_period: 40s
    logging: *logging
    restart: unless-stopped

  # BullMQ consumers of the critical and heavy queues (dues, integrity, audit seal, notifications, exports, backups). Two replicas: BullMQ
  # runs each job once across workers and the schedules are deduplicated, so a worker can die or be redeployed without stopping the jobs.
  worker:
    image: ${KKT_IMAGE_PREFIX:-kkt}-api:${IMAGE_TAG:?set IMAGE_TAG}
    command: ["node", "--import", "./dist/telemetry.js", "dist/worker.js"]
    environment:
      <<: *api-env
      DATABASE_URL_FILE: /run/secrets/database_url
      OTEL_SERVICE_NAME: kkt-worker
      # contract C8: GET :9465/health (200 ok / 503) and :9465/metrics (heartbeat gauge, job counters; METRICS_TOKEN bearer)
      WORKER_HEALTH_PORT: "9465"
      # on stop: heavy jobs checkpoint and go back to the queue at once, critical jobs get this long to finish
      WORKER_DRAIN_TIMEOUT_MS: ${WORKER_DRAIN_TIMEOUT_MS:-120000}
    secrets:
      [
        jwt_secret,
        jwt_signing_keys,
        link_signing_keys,
        hash_keys,
        field_encryption_key,
        hash_key,
        internal_api_token,
        web_revalidate_token,
        redis_url,
        redis_security_url,
        metrics_token,
        s3_access_key,
        s3_secret_key,
        error_webhook_url,
        database_url,
      ]
    volumes: ["storage:/data/storage"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      resources: { limits: { cpus: "2", memory: 2g } }
    # 200 only while Redis answers, the heartbeat is fresh and both queues are consumed (503 while draining)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9465/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 4
    # WORKER_DRAIN_TIMEOUT_MS (120 s) + 60 s for the checkpoint, the queue close and the pools: Docker sends SIGKILL after this
    stop_grace_period: 180s
    logging: *logging
    restart: unless-stopped

  erp:
    build: { context: ., dockerfile: apps/erp/Dockerfile, args: { VITE_API_URL: "" } }
    image: ${KKT_IMAGE_PREFIX:-kkt}-erp:${IMAGE_TAG:?set IMAGE_TAG}
    logging: *logging
    restart: unless-stopped

  portal:
    build: { context: ., dockerfile: apps/portal/Dockerfile, args: { EXPO_PUBLIC_API_URL: "https://my.${DOMAIN}" } }
    image: ${KKT_IMAGE_PREFIX:-kkt}-portal:${IMAGE_TAG:?set IMAGE_TAG}
    logging: *logging
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://erp.${DOMAIN}
        NEXT_PUBLIC_PORTAL_URL: https://my.${DOMAIN}
        NEXT_PUBLIC_ERP_URL: https://erp.${DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://www.${DOMAIN}
    image: ${KKT_IMAGE_PREFIX:-kkt}-web:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      API_INTERNAL_URL: http://api:4000
      # contract C3 (server-side fetches carry the visitor IP under this token) and the revalidation route's token; the image loads
      # <NAME>_FILE into <NAME> at start
      INTERNAL_API_TOKEN_FILE: /run/secrets/internal_api_token
      WEB_REVALIDATE_TOKEN_FILE: /run/secrets/web_revalidate_token
      # contract C4: only for an API that serves several companies
      KKT_COMPANY_SLUG: ${KKT_COMPANY_SLUG:-}
      GIT_SHA: ${IMAGE_TAG}
    secrets: [internal_api_token, web_revalidate_token]
    depends_on: { api: { condition: service_healthy } }
    deploy:
      replicas: ${WEB_REPLICAS:-2}
    logging: *logging
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, erp, web, portal]
    logging: *logging
    restart: unless-stopped

  # nightly encrypted pg_dump with a restore drill, weekly encrypted base backups, retention, WAL cleanup (infra/backup/backup.sh,
  # docs/RESTORE.md). Same image as postgres (age + the script baked in).
  backup:
    build: { context: ./infra/backup }
    image: kkt-backup:16
    entrypoint: ["sh", "/opt/kkt/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: kkt
      PGPASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_encryption_key
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-21:00}
      DUMP_RETENTION_DAYS: ${DUMP_RETENTION_DAYS:-14}
      BASE_BACKUPS_KEEP: ${BASE_BACKUPS_KEEP:-2}
      BACKUP_UPLOAD_CMD: ${BACKUP_UPLOAD_CMD:-}
    secrets: [postgres_password, backup_encryption_key]
    user: "70:70"
    volumes:
      - backups:/backups
    depends_on: { postgres: { condition: service_healthy } }
    logging: *logging
    restart: unless-stopped

  # ---- monitoring (--profile monitoring) -------------------------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    command:
      ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d", "--web.enable-lifecycle"]
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheusdata:/prometheus
    secrets: [metrics_token]
    logging: *logging
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["monitoring"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["./infra/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    # warnings → Slack-compatible webhook; critical → PagerDuty (or Opsgenie: see alertmanager.yml)
    secrets: [error_webhook_url, pagerduty_routing_key, opsgenie_api_key]
    logging: *logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://erp.${DOMAIN}/grafana/
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/kkt-api.json:/var/lib/grafana/dashboards/kkt-api.json:ro
      - grafanadata:/var/lib/grafana
    secrets: [grafana_admin_password]
    # reach it through an SSH tunnel (ssh -L 3001:127.0.0.1:3001 host) — never published on a public interface
    ports: ["127.0.0.1:3001:3000"]
    logging: *logging
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_URI: postgres:5432/kkt?sslmode=disable
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    profiles: ["monitoring"]
    command: ["--redis.addr=redis://redis:6379", "--redis.password-file=/run/secrets/redis_password_map"]
    secrets: [redis_password_map]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["monitoring"]
    command: ["--path.rootfs=/host", "--collector.textfile.directory=/backups"]
    volumes:
      - /:/host:ro,rslave
      - backups:/backups:ro
    restart: unless-stopped

secrets:
  postgres_password: { file: ./infra/secrets/postgres_password }
  kkt_owner_db_password: { file: ./infra/secrets/kkt_owner_db_password }
  kkt_app_db_password: { file: ./infra/secrets/kkt_app_db_password }
  database_url: { file: ./infra/secrets/database_url }
  database_owner_url: { file: ./infra/secrets/database_owner_url }
  pgbouncer_userlist: { file: ./infra/secrets/pgbouncer_userlist }
  redis_password: { file: ./infra/secrets/redis_password }
  redis_password_map: { file: ./infra/secrets/redis_password_map }
  redis_url: { file: ./infra/secrets/redis_url }
  redis_security_url: { file: ./infra/secrets/redis_security_url }
  jwt_secret: { file: ./infra/secrets/jwt_secret }
  field_encryption_key: { file: ./infra/secrets/field_encryption_key }
  hash_key: { file: ./infra/secrets/hash_key }
  metrics_token: { file: ./infra/secrets/metrics_token }
  bootstrap_admin_password: { file: ./infra/secrets/bootstrap_admin_password }
  s3_access_key: { file: ./infra/secrets/s3_access_key }
  s3_secret_key: { file: ./infra/secrets/s3_secret_key }
  grafana_admin_password: { file: ./infra/secrets/grafana_admin_password }
  error_webhook_url: { file: ./infra/secrets/error_webhook_url }
  jwt_signing_keys: { file: ./infra/secrets/jwt_signing_keys }
  link_signing_keys: { file: ./infra/secrets/link_signing_keys }
  hash_keys: { file: ./infra/secrets/hash_keys }
  internal_api_token: { file: ./infra/secrets/internal_api_token }
  web_revalidate_token: { file: ./infra/secrets/web_revalidate_token }
  backup_encryption_key: { file: ./infra/secrets/backup_encryption_key }
  pagerduty_routing_key: { file: ./infra/secrets/pagerduty_routing_key }
  opsgenie_api_key: { file: ./infra/secrets/opsgenie_api_key }

volumes:
  pgdata: {}
  backups: {}
  redisdata: {}
  redissecurity: {}
  miniodata: {}
  storage: {}
  caddy_data: {}
  caddy_config: {}
  prometheusdata: {}
  grafanadata: {}
